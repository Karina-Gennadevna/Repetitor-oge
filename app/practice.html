<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Координатная прямая — Репетитор ОГЭ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0D0F13;
      --surface: #13171F;
      --surface-2: #1A1F2A;
      --border: rgba(255,255,255,0.07);
      --accent: #2AABB3;
      --accent-dim: rgba(42, 171, 179, 0.12);
      --text: #F1F5F9;
      --text-muted: #7A8899;
      --text-soft: #94A3B8;
      --wrong-color: #E8845A;
      --wrong-bg: rgba(232, 132, 90, 0.08);
      --wrong-border: rgba(232, 132, 90, 0.25);
      --correct-color: #4ABA7A;
      --correct-bg: rgba(74, 186, 122, 0.08);
      --correct-border: rgba(74, 186, 122, 0.25);
      --amber: #F8C471;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ─── Шапка ─── */
    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 52px 0 20px;
      flex-shrink: 0;
    }

    .topbar__back {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      padding: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
      transition: color 0.15s;
      margin-top: 3px;
    }

    .topbar__back:hover { color: var(--text-soft); }

    .topbar__info {}

    .topbar__context {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }

    .context-badge {
      background: rgba(248, 196, 113, 0.1);
      border: 1px solid rgba(248, 196, 113, 0.25);
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 11px;
      font-weight: 600;
      color: var(--amber);
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .session-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .topbar__title {
      font-size: 18px;
      font-weight: 800;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    /* ─── Контекст-строка ─── */
    .context-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(248, 196, 113, 0.06);
      border: 1px solid rgba(248, 196, 113, 0.15);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .context-bar__icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .context-bar__text {
      font-size: 13px;
      color: var(--amber);
      font-weight: 500;
      line-height: 1.4;
    }

    /* ─── Прогресс ─── */
    .progress-wrap {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .progress-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .progress-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .progress-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    .progress-track {
      height: 4px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 8px rgba(42, 171, 179, 0.4);
    }

    .progress-dots {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .progress-dot {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: var(--surface-2);
      transition: background 0.3s;
    }

    .progress-dot.done   { background: var(--accent); }
    .progress-dot.active { background: rgba(42, 171, 179, 0.5); }
    .progress-dot.wrong  { background: var(--wrong-color); }

    /* ─── Карточка задания ─── */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .question-card__meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .question-card__num {
      width: 28px;
      height: 28px;
      background: var(--accent-dim);
      border: 1px solid rgba(42,171,179,0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .question-card__tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .question-card__text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
    }

    .question-card__text em {
      font-style: normal;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 1px 6px;
      border-radius: 5px;
    }

    /* ─── Варианты ─── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 18px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .option:active { transform: scale(0.985); }

    .option.selected {
      background: rgba(42, 171, 179, 0.1);
      border-color: rgba(42, 171, 179, 0.55);
      box-shadow: 0 0 16px rgba(42, 171, 179, 0.15);
    }

    .option__letter {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-soft);
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s;
    }

    .option.selected .option__letter {
      background: var(--accent);
      border-color: var(--accent);
      color: #0D0F13;
      font-size: 0;
    }

    .option.selected .option__letter::after {
      content: '';
      display: block;
      width: 10px;
      height: 6px;
      border-left: 2px solid #0D0F13;
      border-bottom: 2px solid #0D0F13;
      transform: rotate(-45deg) translateY(-1px);
    }

    .option__text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }

    /* ─── Feedback ─── */
    .feedback-section { flex: 1; }

    .fb-card {
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      animation: fadeIn 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fb-card.wrong {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
    }

    .fb-card.correct-card {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
    }

    .fb-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .fb-status__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .fb-card.wrong .fb-status__icon {
      background: rgba(232, 132, 90, 0.15);
      border: 1px solid rgba(232, 132, 90, 0.3);
    }

    .fb-card.correct-card .fb-status__icon {
      background: rgba(74, 186, 122, 0.15);
      border: 1px solid rgba(74, 186, 122, 0.3);
    }

    .fb-status__text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .fb-card.wrong .fb-status__text { color: var(--wrong-color); }
    .fb-card.correct-card .fb-status__text { color: var(--correct-color); }

    .fb-answers { display: flex; flex-direction: column; gap: 8px; }

    .fb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .fb-row.yours {
      background: rgba(232, 132, 90, 0.08);
      border: 1px solid rgba(232, 132, 90, 0.2);
    }

    .fb-row.correct-row {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
    }

    .fb-row__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      flex-shrink: 0;
      width: 76px;
    }

    .fb-row.yours .fb-row__label { color: var(--wrong-color); }
    .fb-row.correct-row .fb-row__label { color: var(--correct-color); }

    .fb-row__val { font-size: 15px; font-weight: 600; color: var(--text); }
    .fb-row__icon { margin-left: auto; font-size: 15px; }

    .fb-breakdown {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      animation: fadeIn 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fb-breakdown__header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .fb-breakdown__icon {
      width: 28px;
      height: 28px;
      background: var(--accent-dim);
      border: 1px solid rgba(42,171,179,0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .fb-breakdown__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .fb-breakdown__text {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-soft);
    }

    .math-line {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(42,171,179,0.2);
      border-radius: 8px;
      padding: 5px 12px;
      margin: 6px 0;
    }

    /* ─── Экран завершения ─── */
    .completion-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .completion-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      margin-bottom: 14px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    .completion-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--correct-color), transparent);
      opacity: 0.7;
    }

    .completion-card__icon {
      width: 64px;
      height: 64px;
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
    }

    .completion-card__title {
      font-size: 22px;
      font-weight: 900;
      color: var(--text);
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }

    .completion-card__sub {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.5;
      margin-bottom: 20px;
    }

    .completion-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .cstat {
      background: var(--surface-2);
      border-radius: 12px;
      padding: 12px 8px;
      text-align: center;
    }

    .cstat__val {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 3px;
    }

    .cstat__val.green { color: var(--correct-color); }
    .cstat__val.amber { color: var(--amber); }
    .cstat__val.muted { color: var(--text-soft); }

    .cstat__label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .next-session-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 24px;
    }

    .next-session-card__icon {
      width: 40px;
      height: 40px;
      background: var(--accent-dim);
      border: 1px solid rgba(42,171,179,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .next-session-card__text {
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.4;
    }

    .next-session-card__text strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ─── Нижний блок ─── */
    .bottom {
      padding: 20px 0 0;
      flex-shrink: 0;
      margin-top: auto;
    }

    .btn-next {
      display: block;
      width: 100%;
      padding: 17px 24px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: default;
      text-align: center;
      letter-spacing: -0.01em;
      transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .btn-next.active {
      background: var(--accent);
      color: #0D0F13;
      border-color: transparent;
      box-shadow: 0 0 28px rgba(42, 171, 179, 0.35);
      cursor: pointer;
    }

    .btn-next.active:active { transform: scale(0.98); }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 13px 24px;
      background: transparent;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-top: 10px;
      transition: color 0.15s;
    }

    .btn-secondary:hover { color: var(--text-soft); }

    .micro-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      padding: 14px 0 36px;
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .micro-note {
        padding-bottom: calc(36px + env(safe-area-inset-bottom));
      }
    }

    /* ─── Анимации ─── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-card, .options {
      animation: fadeIn 0.25s ease;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a href="plan.html" class="topbar__back">‹ План</a>
    <div class="topbar__info">
      <div class="topbar__context">
        <span class="context-badge">Слабая тема</span>
        <span class="session-label" id="sessionLabel">Сессия 1 из 3</span>
      </div>
      <div class="topbar__title">Координатная прямая</div>
    </div>
  </div>

  <div class="context-bar">
    <div class="context-bar__icon">📉</div>
    <div class="context-bar__text">Эта тема чаще всего снижает твой результат — отработай её перед следующим пробником</div>
  </div>

  <div class="progress-wrap">
    <div class="progress-header">
      <span class="progress-label">Прогресс тренировки</span>
      <span class="progress-count" id="progressCount">1 / 5</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="question-card__meta">
      <div class="question-card__num" id="questionNum">1</div>
      <div class="question-card__tag">Координатная прямая</div>
    </div>
    <div class="question-card__text" id="questionText"></div>
  </div>

  <div class="options" id="optionsContainer"></div>

  <div class="feedback-section" id="feedbackSection" style="display:none;"></div>

  <div class="completion-screen" id="completionScreen" style="display:none;"></div>

  <div class="bottom" id="bottomBlock">
    <button class="btn-next" id="btnNext" onclick="handleNextBtn()">Далее →</button>
    <div class="micro-note" id="microNote">После 5 задач вернёмся к мини-проверке</div>
  </div>

  <script>
    const QUESTIONS = [
      {
        text: "Найдите расстояние от точки <em>A(−5)</em> до нуля на числовой прямой.",
        options: ["5", "−5", "10", "0"],
        correct: 0,
        explanation: "Расстояние от точки до нуля — это модуль её координаты: |−5| = 5",
        mistake: "Перепутать расстояние с координатой и ответить −5 вместо 5"
      },
      {
        text: "Какое из чисел расположено правее на числовой прямой: <em>−2</em> или <em>−7</em>?",
        options: ["−2", "−7", "Они равны", "Нельзя определить"],
        correct: 0,
        explanation: "На числовой прямой числа возрастают слева направо. −2 > −7, значит −2 правее",
        mistake: "Считать, что −7 правее, потому что 7 больше 2 — но для отрицательных всё наоборот"
      },
      {
        text: "Найдите расстояние между точками <em>A(−4)</em> и <em>B(6)</em> на числовой прямой.",
        options: ["2", "10", "−10", "24"],
        correct: 1,
        explanation: "Расстояние: |6 − (−4)| = |6 + 4| = 10",
        mistake: "Посчитать 6 − 4 = 2, не учтя знак координаты точки A"
      },
      {
        text: "Запиши координату точки, симметричной точке <em>C(3)</em> относительно нуля.",
        options: ["3", "−3", "0", "6"],
        correct: 1,
        explanation: "Симметричная точка относительно нуля — это точка с противоположной координатой: 3 → −3",
        mistake: "Ответить 3 (оставить ту же координату) или 0 (смешать с серединой)"
      },
      {
        text: "На числовой прямой отмечены точки <em>M(−8)</em> и <em>N(−2)</em>. Найдите координату середины отрезка MN.",
        options: ["−5", "−6", "−3", "−10"],
        correct: 0,
        explanation: "Середина: (−8 + (−2)) / 2 = (−10) / 2 = −5",
        mistake: "Сложить координаты без деления: −8 + (−2) = −10, забыв разделить на 2"
      }
    ];

    const TOTAL = QUESTIONS.length;
    let current = 0;
    let selected = null;
    let answers = new Array(TOTAL).fill(null);
    let mode = 'question'; // 'question' | 'feedback' | 'done'

    // ─── Прогресс ───
    function buildDots() {
      const container = document.getElementById('progressDots');
      for (let i = 0; i < TOTAL; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        dot.id = `dot-${i}`;
        container.appendChild(dot);
      }
    }

    function updateProgress() {
      const pct = ((current) / TOTAL) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
      document.getElementById('progressCount').textContent = `${current + 1} / ${TOTAL}`;
      for (let i = 0; i < TOTAL; i++) {
        const dot = document.getElementById(`dot-${i}`);
        dot.className = 'progress-dot';
        if (i < current) {
          dot.classList.add(answers[i] === QUESTIONS[i].correct ? 'done' : 'wrong');
        } else if (i === current) {
          dot.classList.add('active');
        }
      }
    }

    // ─── Рендер вопроса ───
    function renderQuestion() {
      const q = QUESTIONS[current];
      selected = answers[current];

      document.getElementById('questionNum').textContent = current + 1;
      document.getElementById('questionText').innerHTML = q.text;

      const letters = ['А', 'Б', 'В', 'Г'];
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('div');
        btn.className = 'option' + (selected === i ? ' selected' : '');
        btn.innerHTML = `
          <div class="option__letter">${letters[i]}</div>
          <div class="option__text">${opt}</div>
        `;
        btn.onclick = () => selectOption(i);
        container.appendChild(btn);
      });

      updateNextBtn();
      updateProgress();
    }

    function selectOption(idx) {
      if (mode !== 'question') return;
      selected = idx;
      answers[current] = idx;
      document.querySelectorAll('.option').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
      });
      updateNextBtn();
    }

    function updateNextBtn() {
      if (mode !== 'question') return;
      const btn = document.getElementById('btnNext');
      const isLast = current === TOTAL - 1;
      btn.textContent = isLast ? 'Завершить →' : 'Далее →';
      btn.classList.toggle('active', selected !== null);
    }

    // ─── Кнопка «Далее» ───
    function handleNextBtn() {
      if (mode === 'question') {
        if (selected === null) return;
        showFeedback();
      } else if (mode === 'feedback') {
        if (current < TOTAL - 1) {
          current++;
          selected = answers[current];
          mode = 'question';

          document.getElementById('feedbackSection').style.display = 'none';
          document.getElementById('optionsContainer').style.display = '';

          document.getElementById('microNote').textContent = 'После 5 задач вернёмся к мини-проверке';

          // Анимация
          const card = document.getElementById('questionCard');
          const opts = document.getElementById('optionsContainer');
          card.style.animation = 'none';
          opts.style.animation = 'none';
          card.offsetHeight;
          card.style.animation = '';
          opts.style.animation = '';

          renderQuestion();
        } else {
          showCompletion();
        }
      }
    }

    // ─── Feedback ───
    function showFeedback() {
      const q = QUESTIONS[current];
      const isCorrect = selected === q.correct;
      const letters = ['А', 'Б', 'В', 'Г'];

      // Прогресс-точка
      const dot = document.getElementById(`dot-${current}`);
      dot.className = 'progress-dot ' + (isCorrect ? 'done' : 'wrong');

      let cardHTML;
      if (isCorrect) {
        cardHTML = `
          <div class="fb-card correct-card">
            <div class="fb-status">
              <div class="fb-status__icon">✓</div>
              <div class="fb-status__text">Верно!</div>
            </div>
            <div class="fb-row correct-row" style="border-radius:10px;">
              <span class="fb-row__label">Твой ответ</span>
              <span class="fb-row__val">${letters[selected]} — ${q.options[selected]}</span>
              <span class="fb-row__icon">✓</span>
            </div>
          </div>`;
      } else {
        cardHTML = `
          <div class="fb-card wrong">
            <div class="fb-status">
              <div class="fb-status__icon">✗</div>
              <div class="fb-status__text">Неверно</div>
            </div>
            <div class="fb-answers">
              <div class="fb-row yours">
                <span class="fb-row__label">Твой ответ</span>
                <span class="fb-row__val">${letters[selected]} — ${q.options[selected]}</span>
                <span class="fb-row__icon">✗</span>
              </div>
              <div class="fb-row correct-row">
                <span class="fb-row__label">Правильно</span>
                <span class="fb-row__val">${letters[q.correct]} — ${q.options[q.correct]}</span>
                <span class="fb-row__icon">✓</span>
              </div>
            </div>
          </div>`;
      }

      const breakdownHTML = `
        <div class="fb-breakdown">
          <div class="fb-breakdown__header">
            <div class="fb-breakdown__icon">🔢</div>
            <div class="fb-breakdown__title">Разбор</div>
          </div>
          <div class="fb-breakdown__text">${q.explanation}</div>
        </div>`;

      const section = document.getElementById('feedbackSection');
      section.innerHTML = cardHTML + breakdownHTML;
      section.style.display = 'block';

      document.getElementById('optionsContainer').style.display = 'none';

      const isLast = current === TOTAL - 1;
      const btn = document.getElementById('btnNext');
      btn.textContent = isLast ? 'Завершить тренировку →' : 'Следующее задание →';
      btn.classList.add('active');
      btn.style.cursor = 'pointer';

      const note = document.getElementById('microNote');
      note.textContent = isCorrect ? 'Отлично! Ещё одна задача — и тема закрепится' : 'Ничего — разберём и пойдём дальше';

      mode = 'feedback';
    }

    // ─── Завершение тренировки ───
    function showCompletion() {
      const score = answers.filter((a, i) => a === QUESTIONS[i].correct).length;
      const wrong = TOTAL - score;

      document.getElementById('questionCard').style.display = 'none';
      document.getElementById('feedbackSection').style.display = 'none';
      document.getElementById('optionsContainer').style.display = 'none';
      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('progressCount').textContent = `${TOTAL} / ${TOTAL}`;

      // Все точки
      for (let i = 0; i < TOTAL; i++) {
        const dot = document.getElementById(`dot-${i}`);
        dot.className = 'progress-dot ' + (answers[i] === QUESTIONS[i].correct ? 'done' : 'wrong');
      }

      const grade = score >= 4 ? 'Тема закрыта!' : 'Хорошая работа!';
      const sub = score >= 4
        ? 'Ты отработал слабую тему. Теперь проверь закрепление в следующем пробнике.'
        : 'Продолжай — с каждым повторением результат растёт. Пробник покажет прогресс.';

      const completionHTML = `
        <div class="completion-card">
          <div class="completion-card__icon">${score >= 4 ? '✓' : '📈'}</div>
          <div class="completion-card__title">${grade}</div>
          <div class="completion-card__sub">${sub}</div>
          <div class="completion-stats">
            <div class="cstat">
              <div class="cstat__val green">${score}</div>
              <div class="cstat__label">Верно</div>
            </div>
            <div class="cstat">
              <div class="cstat__val amber">${wrong}</div>
              <div class="cstat__label">Ошибок</div>
            </div>
            <div class="cstat">
              <div class="cstat__val muted">${TOTAL}</div>
              <div class="cstat__label">Задач</div>
            </div>
          </div>
        </div>
        <div class="next-session-card">
          <div class="next-session-card__icon">🎯</div>
          <div class="next-session-card__text">
            <strong>Следующий шаг:</strong> пройди пробный экзамен и посмотри, вырос ли прогноз оценки
          </div>
        </div>`;

      const cs = document.getElementById('completionScreen');
      cs.innerHTML = completionHTML;
      cs.style.display = 'flex';
      cs.style.flexDirection = 'column';

      // Кнопки
      const bottom = document.getElementById('bottomBlock');
      bottom.innerHTML = `
        <a href="plan.html" class="btn-next active" style="display:block;text-decoration:none;">Вернуться к плану →</a>
        <a href="exam-trial.html" class="btn-secondary">Пройти следующий пробник</a>
        <div class="micro-note">Прогноз обновится после пробника</div>
      `;

      mode = 'done';
    }

    // ─── Инициализация ───
    buildDots();
    renderQuestion();
  </script>

</body>
</html>
