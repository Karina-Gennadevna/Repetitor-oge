<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пробный экзамен — Репетитор ОГЭ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0D0F13;
      --surface: #13171F;
      --surface-2: #1A1F2A;
      --border: rgba(255,255,255,0.07);
      --accent: #2AABB3;
      --accent-dim: rgba(42, 171, 179, 0.12);
      --text: #F1F5F9;
      --text-muted: #7A8899;
      --text-soft: #94A3B8;
      --wrong-color: #E8845A;
      --wrong-bg: rgba(232, 132, 90, 0.08);
      --wrong-border: rgba(232, 132, 90, 0.25);
      --correct-color: #4ABA7A;
      --correct-bg: rgba(74, 186, 122, 0.08);
      --correct-border: rgba(74, 186, 122, 0.25);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
    }

    /* ─── Шапка ─── */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 52px 0 16px;
      flex-shrink: 0;
    }

    .topbar__left {}

    .btn-skip {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      padding: 4px 0;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .btn-skip:hover { color: var(--text-soft); }

    .topbar__question {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .topbar__subject {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .timer {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 14px;
    }

    .timer__dot {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .timer__time {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.02em;
    }

    .timer__time.warning { color: #F59E0B; }
    .timer__time.danger  { color: #EF4444; }

    /* ─── Прогресс ─── */
    .progress-wrap {
      margin-bottom: 24px;
      flex-shrink: 0;
    }

    .progress-track {
      height: 3px;
      background: var(--surface-2);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-dots {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .progress-dot {
      flex: 1;
      height: 3px;
      border-radius: 99px;
      background: var(--surface-2);
      transition: background 0.3s;
    }

    .progress-dot.done   { background: var(--accent); }
    .progress-dot.active { background: rgba(42, 171, 179, 0.5); }
    .progress-dot.wrong  { background: var(--wrong-color); }

    /* ─── Карточка задания ─── */
    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 16px;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .question-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.5;
    }

    .question-card__meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .question-card__num {
      width: 28px;
      height: 28px;
      background: var(--accent-dim);
      border: 1px solid rgba(42,171,179,0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .question-card__tag {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .question-card__text {
      font-size: 15px;
      line-height: 1.65;
      color: var(--text);
    }

    .question-card__text em {
      font-style: normal;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--accent);
      background: var(--accent-dim);
      padding: 1px 6px;
      border-radius: 5px;
    }

    /* ─── Варианты ─── */
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 15px 18px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    .option:active { transform: scale(0.985); }

    .option.selected {
      background: rgba(42, 171, 179, 0.1);
      border-color: rgba(42, 171, 179, 0.55);
      box-shadow: 0 0 16px rgba(42, 171, 179, 0.15);
    }

    .option__letter {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-soft);
      flex-shrink: 0;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .option.selected .option__letter {
      background: var(--accent);
      border-color: var(--accent);
      color: #0D0F13;
      font-size: 0;
    }

    .option.selected .option__letter::after {
      content: '';
      display: block;
      width: 10px;
      height: 6px;
      border-left: 2px solid #0D0F13;
      border-bottom: 2px solid #0D0F13;
      transform: rotate(-45deg) translateY(-1px);
    }

    .option__text {
      font-size: 16px;
      font-weight: 500;
      color: var(--text);
      flex: 1;
    }

    /* ─── Feedback секция ─── */
    .feedback-section {
      flex: 1;
    }

    /* Feedback — карточка статуса */
    .fb-card {
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 12px;
      animation: fadeIn 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fb-card.wrong {
      background: var(--wrong-bg);
      border: 1px solid var(--wrong-border);
    }

    .fb-card.correct-card {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
    }

    .fb-status {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .fb-status__icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .fb-card.wrong .fb-status__icon {
      background: rgba(232, 132, 90, 0.15);
      border: 1px solid rgba(232, 132, 90, 0.3);
    }

    .fb-card.correct-card .fb-status__icon {
      background: rgba(74, 186, 122, 0.15);
      border: 1px solid rgba(74, 186, 122, 0.3);
    }

    .fb-status__text {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .fb-card.wrong .fb-status__text { color: var(--wrong-color); }
    .fb-card.correct-card .fb-status__text { color: var(--correct-color); }

    .fb-answers {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .fb-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .fb-row.yours {
      background: rgba(232, 132, 90, 0.08);
      border: 1px solid rgba(232, 132, 90, 0.2);
    }

    .fb-row.correct-row {
      background: var(--correct-bg);
      border: 1px solid var(--correct-border);
    }

    .fb-row__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      flex-shrink: 0;
      width: 76px;
    }

    .fb-row.yours .fb-row__label { color: var(--wrong-color); }
    .fb-row.correct-row .fb-row__label { color: var(--correct-color); }

    .fb-row__val {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .fb-row__icon { margin-left: auto; font-size: 15px; }

    /* Breakdown */
    .fb-breakdown {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 12px;
      animation: fadeIn 0.32s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fb-breakdown__header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .fb-breakdown__icon {
      width: 28px;
      height: 28px;
      background: var(--accent-dim);
      border: 1px solid rgba(42,171,179,0.25);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
    }

    .fb-breakdown__title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .fb-breakdown__text {
      font-size: 14px;
      line-height: 1.65;
      color: var(--text-soft);
    }

    .math-line {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-dim);
      border: 1px solid rgba(42,171,179,0.2);
      border-radius: 8px;
      padding: 5px 12px;
      margin: 6px 0;
    }

    /* Подсказка об ошибке */
    .fb-mistake {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: rgba(248, 196, 113, 0.07);
      border: 1px solid rgba(248, 196, 113, 0.2);
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 14px;
      animation: fadeIn 0.36s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fb-mistake__icon { font-size: 16px; line-height: 1.4; flex-shrink: 0; }

    .fb-mistake__text {
      font-size: 13px;
      line-height: 1.5;
      color: #F8C471;
    }

    .fb-mistake__text strong { font-weight: 600; }

    /* ─── Нижний блок ─── */
    .bottom {
      padding: 20px 0 0;
      flex-shrink: 0;
    }

    .btn-next {
      display: block;
      width: 100%;
      padding: 17px 24px;
      background: var(--surface-2);
      color: var(--text-muted);
      font-size: 16px;
      font-weight: 700;
      font-family: 'Inter', sans-serif;
      border: 1px solid var(--border);
      border-radius: 16px;
      cursor: default;
      text-align: center;
      letter-spacing: -0.01em;
      transition: background 0.2s, color 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.1s;
      box-shadow: none;
    }

    .btn-next.active {
      background: var(--accent);
      color: #0D0F13;
      border-color: transparent;
      box-shadow: 0 0 28px rgba(42, 171, 179, 0.35);
      cursor: pointer;
    }

    .btn-next.active:active { transform: scale(0.98); }

    .micro-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      padding: 14px 0 36px;
    }

    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      .micro-note {
        padding-bottom: calc(36px + env(safe-area-inset-bottom));
      }
    }

    /* ─── Анимации ─── */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .question-card, .options {
      animation: fadeIn 0.25s ease;
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar__left">
      <div class="topbar__question" id="questionLabel">Задание 1 из 10</div>
      <div class="topbar__subject">Математика</div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="btn-skip" id="btnSkip" onclick="skipQuestion()">Пропустить ›</button>
      <div class="timer">
        <div class="timer__dot"></div>
        <div class="timer__time" id="timerDisplay">10:00</div>
      </div>
    </div>
  </div>

  <div class="progress-wrap">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
    <div class="progress-dots" id="progressDots"></div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="question-card__meta">
      <div class="question-card__num" id="questionNum">1</div>
      <div class="question-card__tag" id="questionTag">Числа и вычисления</div>
    </div>
    <div class="question-card__text" id="questionText"></div>
  </div>

  <div class="options" id="optionsContainer"></div>

  <!-- Feedback: появляется вместо вариантов после выбора ответа -->
  <div class="feedback-section" id="feedbackSection" style="display:none;"></div>

  <div class="bottom">
    <button class="btn-next" id="btnNext" onclick="handleNextBtn()">Далее →</button>
    <div class="micro-note" id="microNote">Не переживай — ошибки помогут определить слабые темы</div>
  </div>

  <script>
    const QUESTIONS = [
      {
        tag: "Числа и вычисления", icon: "🔢",
        text: "На координатной прямой отмечены точки A и B.\nНайдите расстояние от точки A до точки B, если <em>A(−3)</em> и <em>B(7)</em>.",
        options: ["4", "10", "−10", "21"],
        correct: 1,
        explanation: "Расстояние — модуль разности координат: |7 − (−3)| = |7 + 3| = 10",
        mistake: "Посчитать 7 − 3 = 4, не учтя, что минус перед скобкой меняет знак на плюс"
      },
      {
        tag: "Алгебра", icon: "📐",
        text: "Решите уравнение: <em>2x − 5 = 11</em>",
        options: ["x = 3", "x = 8", "x = 6", "x = −3"],
        correct: 1,
        explanation: "Переносим −5 вправо со сменой знака: 2x = 11 + 5 = 16. Делим на 2: x = 8",
        mistake: "Перенести −5 без смены знака: 2x = 11 − 5 = 6, x = 3"
      },
      {
        tag: "Дроби и проценты", icon: "📊",
        text: "Велосипед стоит 8 400 рублей. На него действует скидка 15%.\nСколько рублей придётся заплатить?",
        options: ["7 140 ₽", "7 560 ₽", "6 800 ₽", "7 980 ₽"],
        correct: 0,
        explanation: "Скидка: 8400 × 0,15 = 1260 ₽. Итого: 8400 − 1260 = 7140 ₽",
        mistake: "Вычесть не 15%, а 10% от 8400 = 840, получив 7560 ₽"
      },
      {
        tag: "Геометрия", icon: "📐",
        text: "Периметр прямоугольника равен 36 см, одна сторона — 10 см.\nЧему равна другая сторона?",
        options: ["26 см", "8 см", "16 см", "6 см"],
        correct: 1,
        explanation: "P = 2(a + b). 36 = 2(10 + b) → 18 = 10 + b → b = 8 см",
        mistake: "Посчитать 36 − 10 = 26, забыв, что периметр нужно разделить на 2"
      },
      {
        tag: "Степени и корни", icon: "🔢",
        text: "Вычислите: <em>√144 + 3²</em>",
        options: ["15", "21", "16", "18"],
        correct: 1,
        explanation: "√144 = 12, 3² = 9. Итог: 12 + 9 = 21",
        mistake: "Перепутать 3² = 6 (умножить на 2 вместо возведения в степень), получив 12 + 6 = 18"
      },
      {
        tag: "Алгебра", icon: "📐",
        text: "Упростите выражение: <em>(a + 3)² − 9</em>",
        options: ["a² + 6a", "a² + 3", "a² − 6a", "a² + 6a + 9"],
        correct: 0,
        explanation: "(a+3)² = a² + 6a + 9. Вычитаем 9: a² + 6a + 9 − 9 = a² + 6a",
        mistake: "Раскрыть скобку как a² + 9, упустив средний член 2·a·3 = 6a"
      },
      {
        tag: "Числа и вычисления", icon: "🔢",
        text: "Найдите значение выражения: <em>−12 · (−3) + (−8)</em>",
        options: ["28", "44", "−28", "−44"],
        correct: 0,
        explanation: "−12 · (−3) = 36 (минус × минус = плюс). 36 + (−8) = 36 − 8 = 28",
        mistake: "Не учесть правило знаков и получить −36 + (−8) = −44"
      },
      {
        tag: "Дроби и проценты", icon: "📊",
        text: "В классе 25 учеников. 12 из них девочки.\nКакой процент составляют мальчики?",
        options: ["48%", "52%", "40%", "60%"],
        correct: 1,
        explanation: "Мальчиков: 25 − 12 = 13. Процент: 13 ÷ 25 × 100 = 52%",
        mistake: "Взять долю девочек (12/25 = 48%) вместо мальчиков (13/25 = 52%)"
      },
      {
        tag: "Геометрия", icon: "📐",
        text: "Угол треугольника ABC равен 90°, сторона <em>AB = 6</em>, <em>BC = 8</em>.\nЧему равна гипотенуза AC?",
        options: ["12", "14", "10", "7"],
        correct: 2,
        explanation: "Теорема Пифагора: AC² = AB² + BC² = 36 + 64 = 100. AC = √100 = 10",
        mistake: "Сложить катеты напрямую: 6 + 8 = 14, не применив теорему Пифагора"
      },
      {
        tag: "Функции и графики", icon: "📈",
        text: "Функция задана формулой <em>y = 2x + 1</em>.\nЧему равно y при x = −2?",
        options: ["−5", "3", "−3", "5"],
        correct: 2,
        explanation: "Подставляем x = −2: y = 2 · (−2) + 1 = −4 + 1 = −3",
        mistake: "Вычислить 2 + (−2) = 0 вместо 2 · (−2) = −4, получив y = 1"
      }
    ];

    const TOTAL = QUESTIONS.length;
    const DURATION = 10 * 60;

    let current = 0;
    let selected = null;
    let answers = new Array(TOTAL).fill(null);
    let timeLeft = DURATION;
    let timerInterval = null;
    let mode = 'question'; // 'question' | 'feedback'

    // ─── Таймер ───
    function startTimer() {
      timerInterval = setInterval(() => {
        timeLeft--;
        updateTimerDisplay();
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          finish();
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      const el = document.getElementById('timerDisplay');
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      el.className = 'timer__time';
      if (timeLeft <= 60) el.classList.add('danger');
      else if (timeLeft <= 180) el.classList.add('warning');
    }

    // ─── Прогресс ───
    function buildDots() {
      const container = document.getElementById('progressDots');
      container.innerHTML = '';
      for (let i = 0; i < TOTAL; i++) {
        const dot = document.createElement('div');
        dot.className = 'progress-dot';
        dot.id = `dot-${i}`;
        container.appendChild(dot);
      }
    }

    function updateProgress() {
      const pct = (current / TOTAL) * 100;
      document.getElementById('progressFill').style.width = pct + '%';
      for (let i = 0; i < TOTAL; i++) {
        const dot = document.getElementById(`dot-${i}`);
        dot.className = 'progress-dot';
        if (i < current) {
          dot.classList.add(answers[i] === QUESTIONS[i].correct ? 'done' : 'wrong');
        } else if (i === current) {
          dot.classList.add('active');
        }
      }
    }

    // ─── Рендер вопроса ───
    function renderQuestion() {
      const q = QUESTIONS[current];
      selected = answers[current];

      document.getElementById('questionLabel').textContent = `Задание ${current + 1} из ${TOTAL}`;
      document.getElementById('questionNum').textContent = current + 1;
      document.getElementById('questionTag').textContent = q.tag;
      document.getElementById('questionText').innerHTML = q.text.replace(/\n/g, '<br>');

      const letters = ['А', 'Б', 'В', 'Г'];
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';

      q.options.forEach((opt, i) => {
        const btn = document.createElement('div');
        btn.className = 'option' + (selected === i ? ' selected' : '');
        btn.innerHTML = `
          <div class="option__letter">${letters[i]}</div>
          <div class="option__text">${opt}</div>
        `;
        btn.onclick = () => selectOption(i);
        container.appendChild(btn);
      });

      updateNextBtn();
      updateProgress();
    }

    function selectOption(idx) {
      if (mode !== 'question') return;
      selected = idx;
      answers[current] = idx;
      document.querySelectorAll('.option').forEach((el, i) => {
        el.classList.toggle('selected', i === idx);
      });
      updateNextBtn();
    }

    function updateNextBtn() {
      const btn = document.getElementById('btnNext');
      if (mode === 'feedback') return;
      const isLast = current === TOTAL - 1;
      btn.textContent = isLast ? 'Завершить →' : 'Далее →';
      btn.classList.toggle('active', selected !== null);
    }

    // ─── Навигация ───
    function skipQuestion() {
      if (mode !== 'question') return;
      answers[current] = null;
      if (current < TOTAL - 1) {
        current++;
        selected = answers[current];
        animateQuestion();
        renderQuestion();
      } else {
        finish();
      }
    }

    function handleNextBtn() {
      if (mode === 'question') {
        if (selected === null) return;
        showFeedback();
      } else {
        // режим feedback — переходим к следующему
        if (current < TOTAL - 1) {
          current++;
          selected = answers[current];
          mode = 'question';

          document.getElementById('feedbackSection').style.display = 'none';
          document.getElementById('optionsContainer').style.display = '';
          document.getElementById('btnSkip').style.display = '';
          document.getElementById('microNote').textContent = 'Не переживай — ошибки помогут определить слабые темы';

          animateQuestion();
          renderQuestion();
        } else {
          finish();
        }
      }
    }

    function animateQuestion() {
      const card = document.getElementById('questionCard');
      const opts = document.getElementById('optionsContainer');
      card.style.animation = 'none';
      opts.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = '';
      opts.style.animation = '';
    }

    // ─── Feedback ───
    function showFeedback() {
      const q = QUESTIONS[current];
      const isCorrect = selected === q.correct;
      const letters = ['А', 'Б', 'В', 'Г'];

      // Отметить точку прогресса
      const dot = document.getElementById(`dot-${current}`);
      dot.className = 'progress-dot ' + (isCorrect ? 'done' : 'wrong');

      // Карточка статуса
      let cardHTML;
      if (isCorrect) {
        cardHTML = `
          <div class="fb-card correct-card">
            <div class="fb-status">
              <div class="fb-status__icon">✓</div>
              <div class="fb-status__text">Верно!</div>
            </div>
            <div class="fb-row correct-row" style="border-radius:10px;">
              <span class="fb-row__label">Твой ответ</span>
              <span class="fb-row__val">${letters[selected]} — ${q.options[selected]}</span>
              <span class="fb-row__icon">✓</span>
            </div>
          </div>`;
      } else {
        cardHTML = `
          <div class="fb-card wrong">
            <div class="fb-status">
              <div class="fb-status__icon">✗</div>
              <div class="fb-status__text">Неверно</div>
            </div>
            <div class="fb-answers">
              <div class="fb-row yours">
                <span class="fb-row__label">Твой ответ</span>
                <span class="fb-row__val">${letters[selected]} — ${q.options[selected]}</span>
                <span class="fb-row__icon">✗</span>
              </div>
              <div class="fb-row correct-row">
                <span class="fb-row__label">Правильно</span>
                <span class="fb-row__val">${letters[q.correct]} — ${q.options[q.correct]}</span>
                <span class="fb-row__icon">✓</span>
              </div>
            </div>
          </div>`;
      }

      // Карточка разбора
      const breakdownHTML = `
        <div class="fb-breakdown">
          <div class="fb-breakdown__header">
            <div class="fb-breakdown__icon">${q.icon}</div>
            <div class="fb-breakdown__title">Разбор</div>
          </div>
          <div class="fb-breakdown__text">${q.explanation}</div>
        </div>`;

      // Подсказка об ошибке (только для неверных)
      let mistakeHTML = '';
      if (!isCorrect && q.mistake) {
        mistakeHTML = `
          <div class="fb-mistake">
            <div class="fb-mistake__icon">⚡</div>
            <div class="fb-mistake__text"><strong>Типичная ошибка:</strong> ${q.mistake}</div>
          </div>`;
      }

      // Заполняем и показываем
      const section = document.getElementById('feedbackSection');
      section.innerHTML = cardHTML + breakdownHTML + mistakeHTML;
      section.style.display = 'block';

      // Скрываем варианты и кнопку "Пропустить"
      document.getElementById('optionsContainer').style.display = 'none';
      document.getElementById('btnSkip').style.display = 'none';

      // Обновляем кнопку
      const isLast = current === TOTAL - 1;
      const btn = document.getElementById('btnNext');
      btn.textContent = isLast ? 'Завершить →' : 'Следующее задание →';
      btn.classList.add('active');
      btn.style.cursor = 'pointer';

      // Обновляем микро-подпись
      const note = document.getElementById('microNote');
      if (!isCorrect) {
        note.innerHTML = `Тема <span style="color:var(--accent)">"${q.tag}"</span> добавлена в список для повторения`;
      } else {
        note.textContent = 'Отлично! Так держать';
      }

      mode = 'feedback';
    }

    // ─── Финиш ───
    function finish() {
      clearInterval(timerInterval);
      const score = answers.filter((a, i) => a === QUESTIONS[i].correct).length;
      const timeSpent = DURATION - timeLeft;
      const state = {
        subject: 'math',
        mode: 'trial',
        score,
        total: TOTAL,
        answers,
        timeSpent
      };
      localStorage.setItem('trial_result', JSON.stringify(state));
      window.location.href = 'result-trial.html';
    }

    // ─── Инициализация ───
    buildDots();
    renderQuestion();
    startTimer();
  </script>

</body>
</html>
